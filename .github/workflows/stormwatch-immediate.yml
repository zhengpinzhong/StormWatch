name: StormWatch Immediate

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  immediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for immediate alerts
        env:
          EMAIL_BACKEND: bark
          BARK_BASE_URL: "https://api.day.app"
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.main immediate

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: update notification state [immediate]"
          git push
